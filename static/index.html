<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>APEX GP</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0}
#ui{position:fixed;inset:0;overflow:auto;padding:20px;background:radial-gradient(circle at 20% 0,#2a0a0a,#0b0d12 60%)}
#ui .w{max-width:900px;margin:auto}
h1{font-size:44px;margin:10px 0;letter-spacing:4px;font-style:italic}h1 b{color:#e10600}
h2{margin:8px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.card{background:#151922;border:1px solid #262c3a;border-radius:12px;padding:14px}
button,input,select{font:inherit;color:#fff;background:#1f2533;border:1px solid #333b4f;border-radius:10px;padding:12px 16px}
button{cursor:pointer;font-weight:700}button:hover{background:#2b3348}
button.r{background:#e10600;border-color:#e10600}.sel{outline:3px solid #fff}
.bar{height:6px;background:#2a3040;border-radius:3px;margin:3px 0 8px}.bar i{display:block;height:100%;border-radius:3px;background:#e10600}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #262c3a;text-align:left}
#hud{position:fixed;left:12px;top:12px;font-weight:700;text-shadow:0 2px 4px #000;display:none;line-height:1.5}
#hud .big{font-size:38px;font-style:italic}
#msg{position:fixed;left:0;right:0;top:25%;text-align:center;font-size:64px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}
#exit{position:fixed;right:12px;top:12px;display:none;padding:8px 12px}
#touch{position:fixed;inset:auto 0 12px 0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch div{display:flex;gap:10px;pointer-events:auto}#touch button{width:76px;height:76px;font-size:28px;opacity:.7;touch-action:none}
</style></head><body>
<canvas id="cv"></canvas><div id="hud"></div><div id="msg"></div><button id="exit">Sair</button>
<div id="touch"><div><button data-k="L">◀</button><button data-k="R">▶</button></div>
<div><button data-k="P" style="width:64px;font-size:16px">PIT</button><button data-k="B">⏹</button><button data-k="G" class="r">▲</button></div></div>
<div id="ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="game.js"></script></body></html>
